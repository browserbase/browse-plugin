name: Release

on:
  push:
    tags:
      - "v*"
  # tag-release (in validate.yml) pushes the tag using the default
  # GITHUB_TOKEN, which GitHub does not allow to trigger other workflows
  # (loop prevention), so it explicitly re-dispatches this workflow instead
  # of relying on the push trigger above to fire. The tag input tells this
  # run which tag to check out and release, since a workflow_dispatch run
  # has no tag ref of its own to infer one from.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------- Validate ----------
      # This repo is a static, no-codebase marketplace catalog: JSON manifests
      # and the browse skill. There is nothing to install or build, so the
      # release job only validates and packages the manifests.
      - name: Validate plugin structure
        run: node scripts/validate-template.mjs

      # ---------- Package ----------
      - name: Create release tarball
        run: |
          tar czf /tmp/release.tar.gz \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.DS_Store' \
            .

          mv /tmp/release.tar.gz release.tar.gz
          echo "Tarball size: $(du -h release.tar.gz | cut -f1)"

      # ---------- Release ----------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release.tar.gz
          generate_release_notes: true
