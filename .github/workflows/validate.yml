name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate plugin structure
        run: node scripts/validate-template.mjs

  # Tags plugin.json's version the moment a version-bump PR merges to main.
  # Never pushes to main itself (only a new tag ref), so this works
  # regardless of branch protection on main. The pushed tag is what
  # triggers release.yml to actually build and publish the release.
  tag-release:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag if plugin.json's version changed
        run: |
          if git diff --quiet ${{ github.sha }}^ ${{ github.sha }} -- plugin.json; then
            echo "plugin.json did not change on this push."
            exit 0
          fi

          OLD_VERSION=$(git show ${{ github.sha }}^:plugin.json | node -pe "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || echo "")
          NEW_VERSION=$(git show ${{ github.sha }}:plugin.json | node -pe "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")

          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "plugin.json's version did not change on this push."
            exit 0
          fi

          TAG="v${NEW_VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
